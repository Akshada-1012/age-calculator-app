<!DOCTYPE html>
<html>
<head>
    <title>🎂 Colorful Age Calculator</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff4e50;
        }
        input {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: #ff4e50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #fc913a;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎉 Age Calculator 🎉</h1>
    <form method="POST">
        <label>📅 Enter Your Date of Birth:</label><br>
        <input type="date" name="dob" required><br>
        <button type="submit">✨ Calculate My Age ✨</button>
    </form>

    {% if age %}
    <div class="result">
        🎂 You are <b>{{ age[0] }}</b> Years,
        <b>{{ age[1] }}</b> Months,
        <b>{{ age[2] }}</b> Days old! 🎉
    </div>
    {% endif %}
</div>

</body>
</html>
